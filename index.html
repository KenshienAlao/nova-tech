<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Nova Logo Preload -->
    <link rel="preload" as="image" href="/favicon.svg" fetchpriority="high" />

    <!-- Hero Preload -->
    <link
      rel="preload"
      as="image"
      href="/assets/hero/nova-hero-1920.webp"
      imagesrcset="
        /assets/hero/nova-hero-350.webp 350w,
        /assets/hero/nova-hero-500.webp 500w,
        /assets/hero/nova-hero-700.webp 700w,
        /assets/hero/nova-hero-1000.webp 1000w,
        /assets/hero/nova-hero-1400.webp 1400w,
        /assets/hero/nova-hero-1920.webp 1920w
      "
      imagesizes="100vw"
      fetchpriority="high"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Nova Tech — Technology for the Way You Live</title>

    <meta
      name="description"
      content="Discover smartphones, laptops, tablets, audio, wearables, and everyday technology at Nova Tech."
    />

    <meta
      name="keywords"
      content="Nova Tech, technology store, smartphones, laptops, tablets, audio, wearables, accessories, electronics"
    />

    <meta name="author" content="Nova Tech" />

    <!-- Theme -->
    <meta name="theme-color" content="#5B5BD6" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Nova Tech — Technology for the Way You Live"
    />

    <meta
      property="og:description"
      content="Discover smartphones, laptops, tablets, audio, wearables, and everyday technology at Nova Tech."
    />

    <meta property="og:site_name" content="Nova Tech" />

    <meta property="og:image" content="/og-image.jpg" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Nova Tech — Technology for the Way You Live"
    />

    <meta
      name="twitter:description"
      content="Discover smartphones, laptops, tablets, audio, wearables, and everyday technology at Nova Tech."
    />

    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Mobile -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nova Tech" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
